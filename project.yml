# XcodeGen spec: turns the Swift files in NEXA/ into an Xcode project so GitHub
# Actions can build an .ipa without anyone owning a Mac.
name: NEXA
options:
  bundleIdPrefix: com.nexa
  deploymentTarget:
    iOS: "17.0"
targets:
  NEXA:
    type: application
    platform: iOS
    sources:
      - path: NEXA
      - path: iOSAssets
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexa.finance
        PRODUCT_NAME: NEXA
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NEXA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSFaceIDUsageDescription: "NEXA uses Face ID to lock your financial data."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
