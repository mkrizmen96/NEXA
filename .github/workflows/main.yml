name: Build NEXA iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project NEXA.xcodeproj \
            -scheme NEXA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/NEXA.app

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | head -40 || true

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NEXA.app Payload/
          zip -qr NEXA.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-ipa
          path: NEXA.ipa
